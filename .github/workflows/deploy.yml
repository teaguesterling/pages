name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily, so new extension releases reach the Recent updates section and feed.xml without a push.
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The Spack manifest takes minutes, so only scheduled and manual runs rebuild it (SPACK_MANIFEST=1).
      # Every run first restores the newest manifest from the cache, so a push deploy shows the same list.
      - name: Restore the Spack manifest
        uses: actions/cache/restore@v4
        with:
          path: src/_data/spack.json
          key: spack-manifest-${{ github.run_id }}
          restore-keys: spack-manifest-

      - name: Fetch latest stats
        run: bash update-stats.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPACK_MANIFEST: ${{ github.event_name == 'push' && '0' || '1' }}

      - name: Save the Spack manifest
        if: github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: src/_data/spack.json
          key: spack-manifest-${{ github.run_id }}

      - run: npm run build
        env:
          PATH_PREFIX: /pages/
          SITE_ORIGIN: https://teaguesterling.github.io

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
