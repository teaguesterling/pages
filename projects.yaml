# Portfolio Projects Configuration
# Used to generate a static portfolio site

site:
  title: "Teague Sterling's Open Source Projects"
  description: "A collection of DuckDB extensions, developer tools, and research projects"
  github_username: teaguesterling
  # The scheme and host the site is served from. With pathPrefix in eleventy.config.js it makes the feed's absolute URLs.
  origin: "https://teaguesterling.github.io"

# The site's pages. The index shows one card per area, and area.njk makes one page per area at /<key>/.
# `categories` are keys under `categories:`, in page order. `composition: true` adds the composition section.
areas:
  - key: duckdb
    title: "DuckDB"
    description: "Extensions I wrote, examples that use them together, and extensions I contribute to"
    categories: [duckdb_extensions, duckdb_contributions]
    composition: true
  - key: spack
    title: "Spack"
    description: "Spack packages I maintain, merged and in review"
    categories: [spack_packages]
    guide: "/spack-duckdb/"
  - key: tools
    title: "Tools and agents"
    description: "Command-line tools, and infrastructure for AI agent safety and control"
    categories: [tools, agent_suite]
  - key: desktop
    title: "Desktop and homelab"
    description: "COSMIC desktop integrations, Cockpit panels and the Tiiny Pocket"
    categories: [cosmic_desktop, cockpit, tiiny]
  - key: research
    title: "Research"
    description: "Scientific software from my research career, and work in progress"
    categories: [academic, experimental]

# Badge configuration templates
badges:
  build:
    template: "https://github.com/{repo}/actions/workflows/{workflow}/badge.svg"
    link_template: "https://github.com/{repo}/actions"
    default_workflow: "MainDistributionPipeline.yml"
  docs:
    template: "https://img.shields.io/badge/docs-available-blue"
  issues:
    template: "https://img.shields.io/github/issues/{repo}"
    link_template: "https://github.com/{repo}/issues"
  license:
    template: "https://img.shields.io/github/license/{repo}"

# Composition examples -- how the extensions work together.
# EVERY snippet below was RUN against the extensions as SERVED by the community registry,
# and each `output` is that run's stdout COPIED VERBATIM -- including DuckDB's own column
# alignment. Do not retype or tidy an output block: the first version of this section
# right-aligned the integers because they looked better that way, which is precisely the
# small fabrication the word "verified" is supposed to rule out. Re-run instead.
composition:
  title: "Composition"
  description: >-
    These extensions are built to be used together. Readers turn different formats into the
    same duck_block type, and other extensions supply the filesystems those readers open --
    git refs, ZIM archives, data: URLs -- with no extension depending on any other.
  install: "INSTALL markdown FROM community; INSTALL webbed FROM community; INSTALL duck_block_utils FROM community;"
  examples:
    - title: "A markdown file's table of contents"
      extensions: ["markdown", "duck_block_utils"]
      sql: |
        LOAD markdown; LOAD duck_block_utils;

        SELECT level, title
        FROM duck_blocks_toc_rows(
               (SELECT list(b) FROM read_markdown_blocks('README.md') b)
             );
      output: |
        ┌───────┬───────────────────────────┐
        │ level │           title           │
        ├───────┼───────────────────────────┤
        │ 1     │ DuckDB Markdown Extension │
        │ 2     │ Features                  │
        │ 2     │ Installation              │
        │ 3     │ Loading the Extension     │
        └───────┴───────────────────────────┘
      note: >-
        Run in the duckdb_markdown checkout. markdown parses the file; duck_block_utils walks
        the structure. The reader knows nothing about tables of contents, and the walker
        knows nothing about markdown.
    - title: "HTML, through the same type"
      extensions: ["webbed", "duck_block_utils"]
      sql: |
        LOAD webbed; LOAD duck_block_utils;

        SELECT b.element_type, b.content
        FROM (SELECT unnest(
                html_to_duck_blocks('<h1>Title</h1><p>Hi there</p><h2>Sub</h2>')
              ) AS b)
        WHERE b.kind = 'block';
      output: |
        ┌──────────────┬──────────┐
        │ element_type │ content  │
        ├──────────────┼──────────┤
        │ heading      │ Title    │
        │ paragraph    │ Hi there │
        │ heading      │ Sub      │
        └──────────────┴──────────┘
      note: >-
        Same element types, same columns, different format. A query written against one
        reader's output runs against the other's.
    - title: "The table of contents as of any git commit"
      extensions: ["duck_tails", "markdown", "duck_block_utils"]
      sql: |
        LOAD duck_tails; LOAD markdown; LOAD duck_block_utils;

        SELECT level, title
        FROM duck_blocks_toc_rows(
               (SELECT list(b) FROM read_markdown_blocks('git://README.md@HEAD') b)
             );
      output: |
        ┌───────┬───────────────────────────┐
        │ level │           title           │
        ├───────┼───────────────────────────┤
        │ 1     │ DuckDB Markdown Extension │
        │ 2     │ Features                  │
        │ 2     │ Installation              │
        └───────┴───────────────────────────┘
      note: >-
        duck_tails registers a git:// filesystem and markdown opens it through DuckDB's
        FileSystem API, so the reader needs no git support at all -- swap @HEAD for a tag
        and you get that release's structure. Three extensions, no dependency between them.
    - title: "An offline Wikipedia article's structure"
      extensions: ["zim", "webbed", "duck_block_utils"]
      sql: |
        LOAD zim; LOAD webbed; LOAD duck_block_utils;

        SELECT level, title
        FROM duck_blocks_toc_rows(
               (SELECT html_to_duck_blocks(decode(zim_get_content('wikipedia.zim', path)))
                FROM read_zim('wikipedia.zim')
                WHERE NOT is_redirect AND title = 'Amphibian' LIMIT 1)
             );
      output: |
        ┌───────┬───────────┐
        │ level │   title   │
        ├───────┼───────────┤
        │ 1     │ Amphibian │
        └───────┴───────────┘
      note: >-
        zim serves the article out of the archive, webbed turns its HTML into blocks, and
        duck_block_utils walks them -- the same walker as the markdown example above. Run
        against a 100-article mini archive, which is why the outline is short.
    - title: "A document with no file at all"
      extensions: ["scalarfs", "webbed", "duck_block_utils"]
      sql: |
        LOAD scalarfs; LOAD webbed; LOAD duck_block_utils;

        SELECT element_type, content
        FROM read_html_blocks('data:,%3Ch1%3EInline%3C/h1%3E%3Cp%3ENo%20file%20needed%3C/p%3E')
        WHERE kind = 'block'
        ORDER BY element_order;
      output: |
        ┌──────────────┬────────────────┐
        │ element_type │    content     │
        ├──────────────┼────────────────┤
        │ heading      │ Inline         │
        │ paragraph    │ No file needed │
        └──────────────┴────────────────┘
      note: >-
        scalarfs is what serves the data: URL -- controlled by running the same query
        without it loaded, where it errors. webbed's reader opens whatever path DuckDB can
        resolve, with no check on the file extension, so a URL carrying no filename works.
    - title: "A live web page, straight into blocks"
      extensions: ["httpfs", "webbed", "duck_block_utils"]
      sql: |
        LOAD httpfs; LOAD webbed; LOAD duck_block_utils;

        SELECT element_type, left(content, 42) AS content
        FROM read_html_blocks('https://example.com/')
        WHERE kind = 'block'
        ORDER BY element_order;
      output: |
        ┌──────────────┬────────────────────────────────────────────┐
        │ element_type │                  content                   │
        ├──────────────┼────────────────────────────────────────────┤
        │ paragraph    │ This domain is for use in documentation ex │
        └──────────────┴────────────────────────────────────────────┘
      note: >-
        Core httpfs fetches it, webbed parses it, duck_block_utils types it -- and the same
        slot takes any filesystem extension, so a caching or object-storage layer drops in
        without the reader knowing. Ran against the live page; example.com is one paragraph
        of body content, which is why the outline is a single row.

    - title: "Two formats in one query, validated by a third extension"
      extensions: ["markdown", "webbed", "duck_block_utils"]
      sql: |
        LOAD markdown; LOAD webbed; LOAD duck_block_utils;

        WITH md   AS (SELECT list(b) AS blocks FROM read_markdown_blocks('README.md') b),
             html AS (SELECT html_to_duck_blocks('<h1>Title</h1><p>Hi</p>') AS blocks)
        SELECT 'markdown' AS source, len(blocks) AS blocks,
               (duck_blocks_validate(blocks)).valid AS conforms FROM md
        UNION ALL
        SELECT 'html', len(blocks), (duck_blocks_validate(blocks)).valid FROM html;
      output: |
        ┌──────────┬────────┬──────────┐
        │  source  │ blocks │ conforms │
        ├──────────┼────────┼──────────┤
        │ markdown │ 1339   │ true     │
        │ html     │ 2      │ true     │
        └──────────┴────────┴──────────┘
      note: >-
        This is the part that makes the suite a suite. Two independently built extensions
        emit the identical STRUCT, a third validates both against a published spec, and a
        UNION ALL across them type-checks -- with no dependency between any of the three.
  footnote: >-
    They agree because the vocabulary is versioned, not because they are linked: there is a
    published spec, one vendorable header of constants, and a drift check that fails CI when
    a consumer's copy disagrees by value -- a rename is a compile error, but a changed value
    is silent.

# Project categories
categories:
  duckdb_extensions:
    # DuckDB 2.0 readiness, measured 2026-10-30 by requesting each extension's 2.0
    # artifact from the registry CDN -- not asserted by hand. The 2026-10-16 pass
    # probed the pre-release key v2.0.0-alpha46057, where only duck_hunt had an
    # artifact. The v2.0.0 key now serves 15 of the 16 extensions below.
    duckdb2_note: >-
      DuckDB 2.0 status below is measured, not asserted. "2.0 released" means a
      2.0-keyed artifact is published and installable from the community registry
      (community-extensions.duckdb.org/v2.0.0/...). An HTTP request confirmed each
      artifact on 2026-10-30, on both linux_amd64 and osx_arm64. A read of one binary's metadata footer checked that the
      path key is truthful; it reports v2.0.0. "2.0 ready" means that repo's CI builds
      green on the 2.0 line, but no 2.0 artifact is published. "2.0 untested" means the
      repo has no 2.0 build leg, which is an absence of evidence rather than a known
      failure. Fifteen of the sixteen extensions below now serve a 2.0 artifact. Every
      extension here also remains installable on v1.5.6.
    subcategories:
      document_processing:
        title: "Document Processing"
        description: "Extensions for parsing, transforming, and analyzing documents"
        projects:
          - id: duckdb_webbed
            name: "webbed"
            duckdb2: released
            duckdb2_note: "Already builds against the registry's own DuckDB 2.0 commit, not just the 2.0 branch."
            repo: teaguesterling/duckdb_webbed
            description: "Comprehensive XML and HTML processing with XPath extraction, schema inference, and format conversion"
            features:
              - "XML/HTML parsing with XPath"
              - "Smart schema inference"
              - "HTML table extraction"
              - "XML to JSON conversion"
            badges: [build, docs, issues]
            docs_url: "https://duckdb-webbed.readthedocs.io"

          - id: duckdb_markdown
            name: "duckdb_markdown"
            duckdb2: released
            repo: teaguesterling/duckdb_markdown
            description: "Comprehensive Markdown processing with file reading, content extraction, and block-level parsing"
            features:
              - "Read and parse Markdown files"
              - "Extract frontmatter, code blocks, links, and headings"
              - "Block-level AST access"
            badges: [build, docs, issues]
            docs_url: "https://github.com/teaguesterling/duckdb_markdown#readme"

          - id: duckdb_yaml
            name: "duckdb_yaml"
            duckdb2: released
            repo: teaguesterling/duckdb_yaml
            description: "YAML file reading with native type support and multi-document handling"
            features:
              - "Read YAML files as structured data"
              - "Multi-document stream support"
              - "Type coercion and validation"
            badges: [build, issues]

          - id: duckdb_duck_block_utils
            name: "duck_block_utils"
            duckdb2: released
            repo: teaguesterling/duckdb_duck_block_utils
            description: "Format-agnostic document block utilities with unified duck_block type and Pandoc AST conversion"
            features:
              - "Unified block representation"
              - "Block builders and transformers"
              - "Pandoc AST interoperability"
            badges: [build, issues]

          - id: duckdb_read_lines
            name: "duckdb_read_lines"
            duckdb2: released
            repo: teaguesterling/duckdb_read_lines
            description: "Simple parsers for fast extraction from line-based files"
            features:
              - "Line-based file parsing"
              - "Fast extraction patterns"
            badges: [build, issues]

          - id: duckdb_panduck
            name: "panduck"
            duckdb2: released
            repo: teaguesterling/duckdb_panduck
            description: "Native in-process document conversion and AST extraction for DuckDB"
            features:
              - "In-process document conversion"
              - "Document AST extraction"
            badges: [build, issues]

      code_analysis:
        title: "Code & Development"
        description: "Extensions for analyzing code, parsing queries, and developer workflows"
        projects:
          - id: duckent
            name: "duckent"
            duckdb2: untested
            duckdb2_note: "Not published to the community registry, so no artifact exists to key to 2.0 -- it returns 404 under both the v1.5.6 and the v2.0.0 key. Its pipeline still pins DuckDB v1.5.4."
            repo: teaguesterling/duckent
            description: "Tree semantics for ordered relations: the ROWS contract and CSS-selector MATCH that sitting_duck and duck_block_utils build on"
            features:
              - "One selector semantics under every parser"
              - "CREATE TREE / USING TREE / MATCH design for DuckDB 2.0"
              - "Any adjacency list conforms via one recursive CTE"
              - "Interactive lesson: from grep to CREATE TREE"
            badges: [issues]
            status: experimental
            docs_url: "https://teaguesterling.github.io/pages/static/tree-contract-lesson.html"

          - id: sitting_duck
            name: "sitting_duck"
            duckdb2: released
            repo: teaguesterling/sitting_duck
            description: "AST analysis using Tree-sitter for 27 programming languages with semantic type extraction"
            features:
              - "Parse source code to AST"
              - "27 language support"
              - "Pattern matching and queries"
              - "Semantic type extraction"
            badges: [build, issues]

          - id: duck_hunt
            name: "duck_hunt"
            duckdb2: released
            duckdb2_note: "First of the fleet with a published DuckDB 2.0 artifact: its descriptor merged after the registry switched its default build to the 2.0 line, which triggered a 2.0-keyed deploy. It is still the only extension with an artifact under the pre-release key v2.0.0-alpha46057."
            repo: teaguesterling/duck_hunt
            description: "Log parsing extension for 90+ development tools and CI/CD systems"
            features:
              - "Parse logs from 90+ tools"
              - "Format auto-detection"
              - "CI/CD workflow parsing"
              - "Context extraction"
            badges: [build, issues]

          - id: duck_tails
            name: "duck_tails"
            duckdb2: released
            repo: teaguesterling/duck_tails
            description: "Git-aware data analysis with version control integration and repository queries"
            features:
              - "git:// protocol support"
              - "Git LFS integration"
              - "Diff analysis"
              - "Repository metadata queries"
            badges: [build, issues]

      data_formats:
        title: "Data & Formats"
        description: "Extensions for specialized data formats and protocols"
        projects:
          - id: duckdb_urlpattern
            name: "duckdb_urlpattern"
            duckdb2: released
            repo: teaguesterling/duckdb_urlpattern
            description: "WHATWG URLPattern API implementation for URL matching and component extraction"
            features:
              - "URLPattern matching"
              - "URL component extraction"
              - "WHATWG standard compliant"
            badges: [build, issues]

          - id: duckdb_scalarfs
            name: "duckdb_scalarfs"
            duckdb2: released
            repo: teaguesterling/duckdb_scalarfs
            description: "Scalar filesystem for in-memory content including variables, inline literals, and data URIs"
            features:
              - "In-memory file content"
              - "Data URI support"
              - "Variable storage"
            badges: [build, issues]

          - id: duckdb_zim
            name: "duckdb_zim"
            duckdb2: released
            repo: teaguesterling/duckdb_zim
            description: "DuckDB extension for reading ZIM files — the offline web-archive format used by Kiwix/Wikipedia"
            features:
              - "Read ZIM archive files"
              - "Query offline web content as tables"
            badges: [build, issues]

      ai_integration:
        title: "AI & Integration"
        description: "Extensions for AI agent integration and dynamic function handling"
        projects:
          - id: duckdb_mcp
            name: "duckdb_mcp"
            duckdb2: released
            repo: teaguesterling/duckdb_mcp
            description: "Model Context Protocol server/client integration for AI agent connectivity"
            features:
              - "MCP server implementation"
              - "HTTP transport"
              - "Custom tool definitions"
              - "Multiple output formats"
            badges: [build, issues]

          - id: duckdb_func_apply
            name: "duckdb_func_apply"
            duckdb2: released
            repo: teaguesterling/duckdb_func_apply
            description: "Dynamic function application allowing runtime invocation of functions by name"
            features:
              - "Runtime function dispatch"
              - "Dynamic invocation"
              - "Metaprogramming support"
            badges: [build, issues]

          - id: fledgling
            name: "fledgling"
            repo: teaguesterling/fledgling
            description: "MCP tools that help AI agents get their bearings in a codebase — unified SQL views over code, git, docs, and conversations, powered by DuckDB"
            features:
              - "Unified SQL views over code"
              - "Git history analysis"
              - "Documentation indexing"
              - "Conversation context"
            badges: [issues]

          - id: ducklog
            name: "ducklog"
            repo: teaguesterling/ducklog
            description: "Policy as a database — compiles umwelt agent-permission views into queryable DuckDB schemas"
            features:
              - "Compile umwelt policy to DuckDB"
              - "Query agent permissions with SQL"
              - "Policy-as-data introspection"
            badges: [issues]

      science:
        title: "Science & Research"
        description: "Extensions for scientific computing and research applications"
        projects:
          - id: plinking_duck
            name: "plinking_duck"
            duckdb2: released
            repo: teaguesterling/plinking_duck
            description: "DuckDB tools for Plink2 genetic data analysis"
            features:
              - "Plink2 file format support"
              - "Genetic data analysis"
            badges: [build, issues]


  # Extensions I've contributed to but didn't author
  duckdb_contributions:
    title: "DuckDB Contributions"
    description: "Extensions I've contributed to or maintain forks of"
    icon: "git-merge"

    projects:
      - id: duckdb_extension_parser_tools
        name: "parser_tools"
        repo: teaguesterling/duckdb_extension_parser_tools
        upstream: duckdb/duckdb_extension_parser_tools
        description: "SQL parsing extension exposing DuckDB's native parser for query analysis"
        features:
          - "Extract tables, functions, columns from SQL"
          - "Query structure analysis"
          - "DuckDB-native parsing"
        badges: [issues]
        role: contributor

      - id: duckdb_iceberg
        name: "duckdb_iceberg"
        repo: teaguesterling/duckdb_iceberg
        upstream: duckdb/duckdb_iceberg
        description: "Apache Iceberg table format support for DuckDB"
        features:
          - "Read Iceberg tables"
          - "Time travel queries"
          - "Partition pruning"
        badges: [build, issues]
        role: contributor
        note: "Originally developed by RelationalAI"

      - id: duckdb_rdkit
        name: "duckdb_rdkit"
        repo: teaguesterling/duckdb_rdkit
        upstream: bodowd/duckdb_rdkit
        description: "RDKit cheminformatics integration for molecular data analysis"
        features:
          - "Molecular structure handling"
          - "Chemical property calculations"
          - "Substructure search"
        badges: [build, issues]
        role: contributor
        note: "Original author: bodowd"

  # Spack packages I maintain. The section is hidden while `projects` is empty.
  # Each entry uses the project-row fields: name, description, spack_url (the package's page on
  # packages.spack.io), upstream (the upstream project's GitHub owner/repo), and optional features and note.
