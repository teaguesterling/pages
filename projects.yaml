    title: "Spack Packages"
    description: "Spack packages I maintain"
    projects:
      - id: spack-duckdb
        name: "duckdb"
        description: "DuckDB, the in-process analytical SQL database: CLI, C/C++ library and headers"
        spack_url: "https://packages.spack.io/package.html?name=duckdb"
        upstream: duckdb/duckdb

      - id: spack-duckdb-extensions-core
        name: "duckdb-extensions (core)"
        description: "DuckDB's core extensions built as Spack packages, and a bundle that installs them together"
        upstream: duckdb/duckdb
        features:
          - "duckdb-extensions (bundle)"
          - "duckdb-avro"
          - "duckdb-aws"
          - "duckdb-azure"
          - "duckdb-delta"
          - "duckdb-ducklake"
          - "duckdb-encodings"
          - "duckdb-excel"
          - "duckdb-fts"
          - "duckdb-httpfs"
          - "duckdb-iceberg"
          - "duckdb-inet"
          - "duckdb-lance"
          - "duckdb-legacy-parser"
          - "duckdb-mysql-scanner"
          - "duckdb-postgres-scanner"
          - "duckdb-quack"
          - "duckdb-spatial"
          - "duckdb-sqlite-scanner"
          - "duckdb-sqlsmith"
          - "duckdb-tpcds"
          - "duckdb-unity-catalog"
          - "duckdb-vortex"
          - "duckdb-vss"
        note: "In spack/spack-packages#7442 (open); source builds trusted by the Spack store in #7489 (open)"

      - id: spack-duckdb-extensions-community
        name: "duckdb-extensions (community)"
        description: "DuckDB community extensions built as Spack packages"
        upstream: duckdb/community-extensions
        features:
          - "duckdb-bigquery"
          - "duckdb-cache-httpfs"
          - "duckdb-duck-hunt"
          - "duckdb-duck-tails"
          - "duckdb-duckpgq"
          - "duckdb-gcs"
          - "duckdb-h3"
          - "duckdb-markdown"
          - "duckdb-mcp"
          - "duckdb-mssql"
          - "duckdb-nanoarrow"
          - "duckdb-plinking-duck"
          - "duckdb-rusty-sheet"
          - "duckdb-scalarfs"
          - "duckdb-sitting-duck"
          - "duckdb-urlpattern"
          - "duckdb-webbed"
          - "duckdb-yaml"
          - "duckdb-zipfs"
        note: "In spack/spack-packages#7444 (open)"

      - id: spack-ada-url
        name: "ada-url"
        description: "Ada, a fast WHATWG-compliant URL parser in C++"
        upstream: ada-url/ada
        note: "In spack/spack-packages#7467 (open)"

      - id: spack-croaring
        name: "croaring"
        description: "CRoaring, a C and C++ library for compressed Roaring bitmaps"
        upstream: RoaringBitmap/CRoaring
        note: "In spack/spack-packages#7459 (open)"

      - id: spack-simdutf
        name: "simdutf"
        description: "simdutf, SIMD-accelerated Unicode validation and transcoding"
        upstream: simdutf/simdutf
        note: "In spack/spack-packages#7462 (open)"

      - id: spack-miniz
        name: "miniz"
        description: "miniz, a single-file zlib-compatible compression library in C"
        upstream: richgel999/miniz
        note: "In spack/spack-packages#7463 (open)"

      - id: spack-minizip-ng
        name: "minizip-ng"
        description: "minizip-ng, a zip archive manipulation library in C"
        upstream: zlib-ng/minizip-ng
        note: "In spack/spack-packages#7460 (open)"

      - id: spack-cmark-gfm
